<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>차량 안전 알림 · 대시보드</title>
<style>
  :root{
    --bg: #07080a;
    --panel: #101216;
    --panel-2: #0b0c10;
    --panel-border: #1e2128;
    --ink: #f3f4f6;
    --ink-dim: #8b909b;
    --ink-faint: #4c505a;

    /* 모니터링(대기) 상태 시그니처 컬러 — 경고색과 확실히 구분되는 차분한 블루 */
    --watch: #3b82f6;
    --watch-glow: rgba(59, 130, 246, .35);

    --stage0: #2f6f5c;
    --stage1: #e5484d;   /* 저소음 알림 */
    --stage2: #f2a93b;   /* 보호자 알림 */
    --stage3: #c0392b;   /* 공조 가동 */

    --card-bg: rgba(26, 27, 31, 0.92);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Pretendard",
            "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

    --ambient: var(--watch-glow);
  }

  * { box-sizing: border-box; }

  html, body{ height: 100%; }

  body{
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse 900px 500px at 18% -8%, var(--ambient) 0%, transparent 55%),
      radial-gradient(ellipse 700px 500px at 88% 6%, rgba(255,255,255,.02) 0%, transparent 45%),
      var(--bg);
    color: var(--ink);
    font-family: var(--font);
    transition: background 900ms ease;
  }

  body[data-stage="1"]{ --ambient: rgba(229,72,77,.20); }
  body[data-stage="2"]{ --ambient: rgba(242,169,59,.22); }
  body[data-stage="3"]{ --ambient: rgba(192,57,43,.30); }

  .page{
    max-width: 1120px;
    margin: 0 auto;
    padding: 28px 24px 90px;
  }

  /* ---------------- 상단 브랜드 바 ---------------- */

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 40px;
  }
  .brand{ display:flex; align-items:center; gap: 12px; }
  .brand-mark{
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(155deg, #1a2536, #0d1420);
    border: 1px solid #263041;
    display:flex; align-items:center; justify-content:center;
    flex-shrink: 0;
  }
  .brand-mark svg{ width: 18px; height: 18px; stroke: var(--watch); fill: none; }
  .brand-text b{ display:block; font-size: 15px; letter-spacing:.01em; }
  .brand-text span{ display:block; font-size: 11.5px; color: var(--ink-faint); margin-top: 1px; }

  .conn{
    font-size: 12px; color: var(--ink-dim);
    display:flex; align-items:center; gap:8px;
    padding: 7px 13px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--panel-border);
  }
  .conn .dot{
    width:7px; height:7px; border-radius:50%; background: #ff6259;
    box-shadow: 0 0 0 3px rgba(255,98,89,.15);
  }
  .conn.live .dot{ background:#37d399; box-shadow: 0 0 0 3px rgba(55,211,153,.18); }

  /* ---------------- 레이아웃 ---------------- */

  .layout{ display:flex; align-items:flex-start; justify-content:center; gap: 64px; }

  .eyebrow{
    font-size: 12px;
    letter-spacing: .08em;
    color: var(--ink-faint);
    text-transform: uppercase;
    margin: 0 0 16px;
    font-weight: 700;
  }

  /* ---------------- 좌측: 가상 스마트폰 잠금화면 + 레이더 시그니처 ---------------- */

  .phone-column{ display:flex; flex-direction:column; align-items:center; }

  .phone-halo{
    position: relative;
    display:flex; align-items:center; justify-content:center;
  }
  .halo-ring{
    position: absolute;
    border-radius: 50%;
    border: 1px solid var(--watch);
    opacity: 0;
    pointer-events: none;
  }
  .phone-halo.scanning .halo-ring{
    animation: radarPulse 2.8s ease-out infinite;
  }
  .phone-halo.scanning .halo-ring:nth-child(2){ animation-delay: .9s; }
  .phone-halo.scanning .halo-ring:nth-child(3){ animation-delay: 1.8s; }
  body[data-stage="1"] .halo-ring{ border-color: var(--stage1); }
  body[data-stage="2"] .halo-ring{ border-color: var(--stage2); }
  body[data-stage="3"] .halo-ring{ border-color: var(--stage3); }

  @keyframes radarPulse{
    0%   { width: 320px; height: 660px; opacity: .5; }
    100% { width: 460px; height: 800px; opacity: 0; }
  }

  .phone{
    width: 300px;
    height: 620px;
    background: #050506;
    border-radius: 46px;
    border: 6px solid #050506;
    box-shadow:
      0 0 0 1.5px #262a31,
      0 30px 70px -20px rgba(0,0,0,.75),
      inset 0 0 0 1px rgba(255,255,255,.02);
    padding: 26px 16px 20px;
    position: relative;
    overflow: hidden;
    z-index: 1;
    background-image:
      radial-gradient(ellipse at 50% -10%, #1c1f26 0%, #08080a 60%);
  }

  .phone-status{ text-align:center; margin-bottom: 22px; }
  .phone-date{
    font-size: 13px;
    color: rgba(255,255,255,.7);
    letter-spacing: .02em;
    margin-bottom: 6px;
  }
  .phone-time{
    font-size: 52px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: .01em;
    line-height: 1;
    color: #fff;
  }

  .notif-stack{
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 26px;
  }

  .notif{
    background: var(--card-bg);
    backdrop-filter: blur(18px);
    border-radius: 18px;
    padding: 13px 14px;
    opacity: 0;
    transform: translateY(-8px);
    animation: notifIn .35s ease forwards;
    border: 1px solid rgba(255,255,255,.05);
  }
  .notif.stage3{
    background: linear-gradient(160deg, #d0473a, var(--stage3));
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 10px 30px -12px rgba(192,57,43,.55);
  }
  @keyframes notifIn{
    to{ opacity: 1; transform: translateY(0); }
  }

  .notif-top{
    display:flex;
    align-items:center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .notif-icon{
    width: 22px; height: 22px;
    border-radius: 7px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink: 0;
  }
  .notif-icon.s1{ background: var(--stage1); }
  .notif-icon.s2{ background: var(--stage2); }
  .notif-icon.s3{ background: rgba(255,255,255,.94); }
  .notif-icon.s3 svg{ stroke: var(--stage3); }
  .notif-icon svg{ width: 13px; height: 13px; stroke: #fff; fill: none; }

  .notif-app{
    font-size: 12.5px;
    font-weight: 600;
    color: rgba(255,255,255,.6);
    flex: 1;
  }
  .notif.stage3 .notif-app{ color: rgba(255,255,255,.78); }
  .notif-time{ font-size: 11.5px; color: rgba(255,255,255,.45); }
  .notif.stage3 .notif-time{ color: rgba(255,255,255,.68); }

  .notif-title{
    font-size: 14.5px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 3px;
  }
  .notif-body{
    font-size: 13px;
    line-height: 1.45;
    color: rgba(255,255,255,.82);
  }

  .notif-empty{
    text-align: center;
    color: rgba(255,255,255,.28);
    font-size: 13px;
    margin-top: 44px;
    line-height: 1.65;
  }

  .phone-caption{
    margin-top: 20px;
    font-size: 12px;
    line-height: 1.6;
    color: var(--ink-faint);
    text-align: center;
    max-width: 300px;
  }

  /* ---------------- 우측: 제어/상태 패널 ---------------- */

  .panel-column{ width: 380px; display:flex; flex-direction:column; gap: 18px; }

  .card{
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 1px 0 rgba(255,255,255,.02) inset, 0 20px 40px -30px rgba(0,0,0,.6);
  }

  .status-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 18px;
  }
  .engine-pill{
    display:inline-flex; align-items:center; gap:7px;
    padding: 6px 12px; border-radius: 999px;
    font-size: 12.5px; font-weight: 600;
    background: rgba(59,130,246,.12); color: var(--watch);
    border: 1px solid rgba(59,130,246,.25);
  }
  .engine-pill.off{ background: rgba(229,72,77,.12); color: #ff6b6f; border-color: rgba(229,72,77,.28); }
  .pill-dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }

  .stage-badge{
    font-size: 11.5px; font-weight: 800; padding: 6px 11px; border-radius: 8px;
    color: #fff; background: var(--ink-faint);
    letter-spacing: .02em;
  }
  .stage-badge.s0{ background: var(--stage0); }
  .stage-badge.s1{ background: var(--stage1); }
  .stage-badge.s2{ background: var(--stage2); color:#1a1400; }
  .stage-badge.s3{ background: var(--stage3); }

  .timer-row{ display:flex; align-items:baseline; gap: 10px; }
  .timer{
    font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums;
    font-family: var(--mono);
    letter-spacing: -.01em;
  }
  .timer-unit{ font-size: 16px; color: var(--ink-dim); font-weight: 500; }
  .timer-label{ font-size: 12.5px; color: var(--ink-dim); margin-top: 4px; }

  .stat-grid{
    display:grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-top: 20px;
  }
  .stat{
    background: var(--panel-2); border: 1px solid var(--panel-border);
    border-radius: 13px; padding: 14px 8px; text-align:center;
    transition: border-color 200ms ease;
  }
  .stat svg{ width: 16px; height: 16px; stroke: var(--ink-dim); fill:none; margin-bottom: 6px; }
  .stat b{ display:block; font-size: 21px; font-family: var(--mono); }
  .stat span{ font-size: 10.5px; color: var(--ink-dim); }

  .btn-row{ display:flex; gap: 10px; margin-top: 20px; }
  button{
    flex:1; padding: 12px; border-radius: 11px; border: 1px solid var(--panel-border);
    background:#16181d; color: var(--ink); font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: var(--font);
    transition: background 150ms ease, transform 100ms ease;
  }
  button:hover{ background:#1c1e24; }
  button:active{ transform: scale(.98); }
  button.primary{ background: linear-gradient(155deg, #ef5a53, var(--stage1)); border-color: transparent; }
  button.primary:hover{ background: linear-gradient(155deg, #ff685f, #ef4a45); }

  .log-title{
    display:flex; align-items:center; gap: 8px;
    font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink-faint); font-weight: 700; margin-bottom: 14px;
  }
  .log-title svg{ width: 13px; height: 13px; stroke: var(--ink-faint); fill:none; }

  .log-item{
    display:flex; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--panel-border);
    font-size: 12.5px; color: var(--ink-dim);
  }
  .log-item:last-child{ border-bottom:none; padding-bottom: 0; }
  .log-item:first-child{ padding-top: 0; }
  .log-dot{
    width: 6px; height: 6px; border-radius: 50%; flex-shrink:0; margin-top: 5px;
    background: var(--stage2);
  }
  .log-time{ color: var(--ink); font-family: var(--mono); font-weight: 600; }
  .tg-ok{ color:#37d399; }
  .tg-fail{ color:#ff6b6f; }
  .log-empty{ font-size: 12.5px; color: var(--ink-faint); }

  @media (max-width: 820px){
    .layout{ flex-direction: column; align-items:center; gap: 40px; }
    .panel-column{ width: 100%; max-width: 380px; }
  }
</style>
</head>
<body data-stage="0">
<div class="page">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 17h14M6 17l1.2-5.4A2 2 0 0 1 9.14 10h5.72a2 2 0 0 1 1.94 1.6L18 17M7 17v2M17 17v2"/>
          <circle cx="7.5" cy="14.2" r="1.1"/><circle cx="16.5" cy="14.2" r="1.1"/>
        </svg>
      </div>
      <div class="brand-text">
        <b>차량 안전 알림</b>
        <span>Car Guardian · 실시간 방치 감지</span>
      </div>
    </div>
    <div class="conn" id="connBadge"><span class="dot"></span><span id="connText">서버 연결 중…</span></div>
  </div>

  <div class="layout">

    <div class="phone-column">
      <p class="eyebrow">발표용 잠금화면 시뮬레이션</p>

      <div class="phone-halo" id="phoneHalo">
        <span class="halo-ring"></span>
        <span class="halo-ring"></span>
        <span class="halo-ring"></span>

        <div class="phone">
          <div class="phone-status">
            <div class="phone-date" id="phoneDate">-</div>
            <div class="phone-time" id="phoneTime">--:--</div>
          </div>
          <div class="notif-stack" id="notifStack">
            <div class="notif-empty" id="notifEmpty">현재 방치 감지 없음<br/>시동이 꺼지고 아동/반려동물이<br/>남아있으면 여기에 알림이 쌓입니다.</div>
          </div>
        </div>
      </div>

      <div class="phone-caption">
        이 화면은 발표/시연용 가상 잠금화면입니다.
        실제 보호자 휴대폰에는 텔레그램으로 2단계 알림이 별도 전송됩니다.
      </div>
    </div>

    <div class="panel-column">

      <div class="card">
        <div class="status-row">
          <span class="engine-pill off" id="enginePill"><span class="pill-dot"></span><span id="engineText">엔진 상태 확인 중</span></span>
          <span class="stage-badge s0" id="stageBadge">대기</span>
        </div>

        <div class="timer-row">
          <span class="timer" id="timerValue">0.0</span>
          <span class="timer-unit">초</span>
        </div>
        <div class="timer-label">시동 꺼짐 이후 경과 시간</div>

        <div class="stat-grid">
          <div class="stat">
            <svg viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c1.4-3.6 4.3-5.5 7.5-5.5s6.1 1.9 7.5 5.5"/></svg>
            <b id="personCount">0</b><span>전체 인원</span>
          </div>
          <div class="stat">
            <svg viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7.2" r="2.6"/><path d="M5.5 20c1.2-3.2 3.7-4.8 6.5-4.8s5.3 1.6 6.5 4.8"/></svg>
            <b id="childCount">0</b><span>아동(≤7세)</span>
          </div>
          <div class="stat">
            <svg viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.8" cy="8.2" r="1.5"/><circle cx="12" cy="6.3" r="1.5"/><circle cx="16.2" cy="8.2" r="1.5"/><circle cx="9" cy="12" r="1.4"/><path d="M8.2 15.2c.6-1.6 1.9-2.5 3.8-2.5s3.2.9 3.8 2.5c.5 1.3-.5 2.8-2 2.8h-3.6c-1.5 0-2.5-1.5-2-2.8z"/></svg>
            <b id="animalCount">0</b><span>반려동물</span>
          </div>
        </div>

        <div class="btn-row">
          <button class="primary" id="resetBtn">방치 상태 초기화</button>
        </div>
      </div>

      <div class="card">
        <div class="status-row" style="margin-bottom:14px;">
          <div class="log-title" style="margin-bottom:0;">
            <svg viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            보호자 알림 로그 (텔레그램)
          </div>
          <button id="clearLogBtn" style="flex:none; padding:6px 12px; font-size:11.5px;">로그 지우기</button>
        </div>
        <div id="logList">
          <div class="log-empty">아직 전송된 알림이 없습니다.</div>
        </div>
      </div>

    </div>

  </div>
</div>

<script>
  const ICONS = {
    bell: '<svg viewBox="0 0 24 24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>',
    warn: '<svg viewBox="0 0 24 24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>',
    wind: '<svg viewBox="0 0 24 24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9.59 4.59A2 2 0 1 1 11 8H2"/><path d="M12.59 19.41A2 2 0 1 0 14 16H2"/><path d="M17.73 7.73A2.5 2.5 0 1 1 19.5 12H2"/></svg>',
  };

  const STAGE_META = {
    1: { icon: ICONS.bell,  cls: 's1', title: '1단계 · 저소음 알림',
         body: '차량 내 아동/반려동물로 추정되는 대상이 감지되었습니다.' },
    2: { icon: ICONS.warn,  cls: 's2', title: '2단계 · 보호자 확인 필요',
         body: null }, // body는 실시간 데이터로 채움
    3: { icon: ICONS.wind,  cls: 's3', title: '3단계 · 공조(에어컨) 가동됨',
         body: '즉시 차량으로 이동해주세요.' },
  };

  const els = {
    connBadge: document.getElementById('connBadge'),
    connText: document.getElementById('connText'),
    phoneDate: document.getElementById('phoneDate'),
    phoneTime: document.getElementById('phoneTime'),
    phoneHalo: document.getElementById('phoneHalo'),
    notifStack: document.getElementById('notifStack'),
    notifEmpty: document.getElementById('notifEmpty'),
    enginePill: document.getElementById('enginePill'),
    engineText: document.getElementById('engineText'),
    stageBadge: document.getElementById('stageBadge'),
    timerValue: document.getElementById('timerValue'),
    personCount: document.getElementById('personCount'),
    childCount: document.getElementById('childCount'),
    animalCount: document.getElementById('animalCount'),
    logList: document.getElementById('logList'),
    resetBtn: document.getElementById('resetBtn'),
  };

  function tickClock(){
    const now = new Date();
    const days = ['일','월','화','수','목','금','토'];
    els.phoneDate.textContent =
      `${now.getMonth()+1}월 ${now.getDate()}일 ${days[now.getDay()]}요일`;
    els.phoneTime.textContent =
      `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  }
  tickClock();
  setInterval(tickClock, 1000);

  let shownStages = new Set(); // 이번 방치 사건 동안 이미 카드로 그린 단계

  function renderNotifications(stage, data){
    if (stage === 0){
      shownStages.clear();
      els.notifStack.innerHTML = '';
      els.notifStack.appendChild(els.notifEmpty);
      return;
    }

    if (els.notifEmpty.parentNode) els.notifEmpty.remove();

    for (let s = 1; s <= stage; s++){
      if (shownStages.has(s)) continue;
      shownStages.add(s);

      const meta = STAGE_META[s];
      const div = document.createElement('div');
      div.className = `notif ${meta.cls === 's3' ? 'stage3' : ''}`;

      let bodyText = meta.body;
      if (s === 2){
        const who = data.child_count > 0 ? `아동 ${data.child_count}명` :
                    data.animal_count > 0 ? `반려동물 ${data.animal_count}마리` : '탑승자';
        bodyText = `${who}이(가) ${Math.round(data.elapsed_seconds)}초째 차량 내부에 있습니다. 확인해주세요.`;
      }

      div.innerHTML = `
        <div class="notif-top">
          <div class="notif-icon ${meta.cls}">${meta.icon}</div>
          <div class="notif-app">차량 안전 알림</div>
          <div class="notif-time">방금</div>
        </div>
        <div class="notif-title">${meta.title}</div>
        <div class="notif-body">${bodyText}</div>
      `;
      els.notifStack.appendChild(div);
    }
  }

  function renderLog(history){
    if (!history || history.length === 0){
      els.logList.innerHTML = '<div class="log-empty">아직 전송된 알림이 없습니다.</div>';
      return;
    }
    els.logList.innerHTML = history.slice().reverse().map(item => `
      <div class="log-item">
        <span class="log-dot" style="background:${item.stage >= 3 ? 'var(--stage3)' : 'var(--stage2)'}"></span>
        <div>
          <span class="log-time">${item.time}</span> · ${item.stage}단계 발생 ·
          <span class="${item.telegram_sent ? 'tg-ok' : 'tg-fail'}">
            ${item.telegram_sent ? '텔레그램 전송 완료' : '텔레그램 미전송(토큰 미설정)'}
          </span>
        </div>
      </div>
    `).join('');
  }

  function applyState(data){
    els.personCount.textContent = data.person_count;
    els.childCount.textContent = data.child_count;
    els.animalCount.textContent = data.animal_count;
    els.timerValue.textContent = data.elapsed_seconds.toFixed(1);

    document.body.dataset.stage = String(data.stage);
    els.phoneHalo.classList.toggle('scanning', !data.engine_on && data.elapsed_seconds > 0);

    if (data.engine_on){
      els.enginePill.classList.remove('off');
      els.engineText.textContent = '엔진 ON';
    } else {
      els.enginePill.classList.add('off');
      els.engineText.textContent = '엔진 OFF';
    }

    const stageClass = `s${data.stage}`;
    els.stageBadge.className = `stage-badge ${stageClass}`;
    els.stageBadge.textContent =
      data.stage === 0 ? '대기' :
      data.stage === 1 ? '1단계' :
      data.stage === 2 ? '2단계' : '3단계';

    renderNotifications(data.stage, data);
    renderLog(data.history);
  }

  function connect(){
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}/ws`);

    ws.onopen = () => {
      els.connBadge.classList.add('live');
      els.connText.textContent = '실시간 연결됨';
    };
    ws.onclose = () => {
      els.connBadge.classList.remove('live');
      els.connText.textContent = '연결 끊김 · 재시도 중…';
      setTimeout(connect, 1500);
    };
    ws.onerror = () => ws.close();
    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === 'status') applyState(msg.data);
    };
  }
  connect();

  els.resetBtn.addEventListener('click', async () => {
    await fetch('/api/reset', { method: 'POST' });
  });

  document.getElementById('clearLogBtn').addEventListener('click', async () => {
    await fetch('/api/reset?clear_history=true', { method: 'POST' });
  });
</script>
</body>
</html>
